[project]
name = "ar-ap-service"
version = "0.1.0"
description = "Accounts Receivable / Accounts Payable Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "structlog",
    "httpx",
    "python-jose[cryptography]",
    "alembic",
    "reportlab",
    "shared-lib",
    "tenant-service",
    "coa-service",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "testcontainers[postgres]>=4.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
shared-lib = { workspace = true }
tenant-service = { workspace = true }
coa-service = { workspace = true }
