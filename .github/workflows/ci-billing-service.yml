name: CI - billing-service

on:
  push:
    branches: [develop]
    paths:
      - "packages/billing-service/**"
      - "packages/shared-lib/**"
      - "packages/tenant-service/**"
      - "pyproject.toml"
      - ".github/workflows/ci-billing-service.yml"
  pull_request:
    paths:
      - "packages/billing-service/**"
      - "packages/shared-lib/**"
      - "packages/tenant-service/**"
      - "pyproject.toml"
      - ".github/workflows/ci-billing-service.yml"

permissions:
  contents: read

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.x"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync dependencies
        run: uv sync --package billing-service --group dev

      - name: Ruff check
        run: uv run --package billing-service ruff check --select E,W,F --ignore E501,F401 packages/billing-service/src

      - name: Ruff format check
        run: uv run --package billing-service ruff format --check packages/billing-service/src

      - name: Mypy
        run: uv run --package billing-service mypy --ignore-missing-imports packages/billing-service/src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.x"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync dependencies
        run: uv sync --package billing-service --group dev

      - name: Run unit tests
        run: uv run --package billing-service pytest packages/billing-service/tests/unit -v --cov=packages/billing-service/src --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-billing-service
          path: coverage.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.x"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync dependencies
        run: uv sync --package billing-service --group dev

      - name: Run integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
        run: uv run --package billing-service pytest packages/billing-service/tests/integration -v
