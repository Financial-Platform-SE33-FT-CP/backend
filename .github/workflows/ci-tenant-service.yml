name: CI - tenant-service

on:
  push:
    branches: [develop]
    paths:
      - "packages/tenant-service/**"
      - "packages/shared-lib/**"
      - "backend/pyproject.toml"
      - ".github/workflows/ci-tenant-service.yml"
  pull_request:
    paths:
      - "packages/tenant-service/**"
      - "packages/shared-lib/**"
      - "backend/pyproject.toml"
      - ".github/workflows/ci-tenant-service.yml"

permissions:
  contents: write

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: true

      - name: Sync dependencies
        working-directory: .
        run: uv sync --package tenant-service --group dev

      - name: Ruff check
        working-directory: .
        run: |
          uv run --package tenant-service ruff check --select E,W,F --ignore E501,F401 packages/tenant-service/src || {
            echo "Ruff check failed. Attempting to fix..."
            uv run --package tenant-service ruff check --fix --select E,W,F --ignore E501,F401 packages/tenant-service/src
            echo "Files changed:"
            git diff --name-only
            if [ -n "$(git status --porcelain)" ]; then
              git config --local user.email "github-actions[bot]@users.noreply.github.com"
              git config --local user.name "github-actions[bot]"
              git add packages/tenant-service/src
              git commit -m "fix: auto-fix ruff lint issues in tenant-service [skip ci]"
              git push
              echo "Changes committed and pushed."
            fi
            exit 1
          }

      - name: Ruff format check
        working-directory: .
        run: |
          uv run --package tenant-service ruff format --check packages/tenant-service/src || {
            echo "Ruff format check failed. Attempting to fix..."
            uv run --package tenant-service ruff format packages/tenant-service/src
            echo "Files changed:"
            git diff --name-only
            if [ -n "$(git status --porcelain)" ]; then
              git config --local user.email "github-actions[bot]@users.noreply.github.com"
              git config --local user.name "github-actions[bot]"
              git add packages/tenant-service/src
              git commit -m "style: auto-format code in tenant-service [skip ci]"
              git push
              echo "Changes committed and pushed."
            fi
            exit 1
          }

      - name: Mypy
        working-directory: .
        run: uv run --package tenant-service mypy --ignore-missing-imports packages/tenant-service/src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: true

      - name: Sync dependencies
        working-directory: .
        run: uv sync --package tenant-service --group dev

      - name: Run unit tests
        working-directory: .
        run: |
          if [ -d "packages/tenant-service/tests/unit" ]; then
            uv run --package tenant-service pytest packages/tenant-service/tests/unit -v --cov=packages/tenant-service/src --cov-report=xml || [ $? -eq 5 ]
          else
            echo "No unit tests directory found, running all tests with coverage."
            uv run --package tenant-service pytest packages/tenant-service/tests -v --cov=packages/tenant-service/src --cov-report=xml || [ $? -eq 5 ]
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tenant-service
          path: coverage.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: true

      - name: Sync dependencies
        working-directory: .
        run: uv sync --package tenant-service --group dev

      - name: Run integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
        working-directory: .
        run: |
          if [ -d "packages/tenant-service/tests/integration" ]; then
            uv run --package tenant-service pytest packages/tenant-service/tests/integration -v || [ $? -eq 5 ]
          else
            echo "No integration tests directory found, skipping."
          fi
